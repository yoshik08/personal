<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>play — yoshik.xyz</title>
<meta name="description" content="a minimal personal music library. upload, play, synced lyrics.">
<link rel="canonical" href="https://yoshik.xyz/play">
<meta property="og:title" content="play — yoshik.xyz">
<meta property="og:description" content="a minimal personal music library. upload, play, synced lyrics.">
<meta property="og:url" content="https://yoshik.xyz/play">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="play — yoshik.xyz">
<meta name="twitter:description" content="a minimal personal music library.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%237d9bff' stroke-width='2.5'/><path d='M13 11l8 5-8 5z' fill='%237d9bff'/></svg>">
<link rel="preload" href="/assets/fonts/HankenGrotesk-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url("/assets/fonts/HankenGrotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 500; font-display: swap;
    src: url("/assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }
</style>
<link rel="stylesheet" href="/play/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="primary">
    <a class="brand" href="#/">play</a>
    <nav id="mainnav">
      <a href="#/" data-route="home"><span class="ni">⌂</span>home</a>
      <a href="#/settings" data-route="settings"><span class="ni">⚙</span>settings</a>
    </nav>
    <div class="side-foot" id="userbox"></div>
  </aside>

  <main id="main"><div id="view" tabindex="-1"></div></main>

  <nav id="mobilenav" aria-label="primary mobile">
    <a href="#/" data-route="home">⌂<span>home</span></a>
    <a href="#/settings" data-route="settings">⚙<span>settings</span></a>
  </nav>

  <div id="miniplayer" hidden>
    <img id="mp-art" alt="">
    <div class="mp-meta"><div id="mp-title"></div><div id="mp-artist" class="dim"></div></div>
    <div id="mp-status" class="dim mono"></div>
    <button id="mp-toggle" class="pbtn" aria-label="play or pause">▶</button>
  </div>

  <footer id="playerbar" hidden>
    <div class="pb-left">
      <img id="pb-art" alt="">
      <div class="pb-meta"><div id="pb-title"></div><div id="pb-artist" class="dim"></div></div>
    </div>
    <div class="pb-center">
      <div class="pb-controls">
        <button id="pb-shuffle" class="iconbtn" aria-label="shuffle">⇄</button>
        <button id="pb-prev" class="pbtn" aria-label="previous">⏮</button>
        <button id="pb-toggle" class="pbtn big" aria-label="play or pause">▶</button>
        <button id="pb-next" class="pbtn" aria-label="next">⏭</button>
        <button id="pb-repeat" class="iconbtn" aria-label="repeat">↻</button>
      </div>
      <div class="pb-seek">
        <span id="pb-cur" class="mono dim">0:00</span>
        <input id="pb-range" type="range" min="0" max="1000" value="0" aria-label="seek">
        <span id="pb-dur" class="mono dim">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <button id="pb-lyrics" class="iconbtn" aria-label="lyrics">♪</button>
      <button id="pb-queue" class="iconbtn" aria-label="queue">☰</button>
      <button id="pb-expand" class="iconbtn" aria-label="now playing">⤢</button>
      <input id="pb-vol" type="range" min="0" max="100" value="80" aria-label="volume">
    </div>
  </footer>

  <div id="nowplaying" hidden role="dialog" aria-label="now playing">
    <button id="np-close" class="iconbtn" aria-label="close">✕</button>
    <div class="np-main">
      <img id="np-art" alt="">
      <div class="np-title" id="np-title"></div>
      <div class="np-artist dim" id="np-artist"></div>
      <input id="np-range" type="range" min="0" max="1000" value="0" aria-label="seek">
      <div class="np-times"><span id="np-cur" class="mono dim">0:00</span><span id="np-dur" class="mono dim">0:00</span></div>
      <div class="np-controls">
        <button id="np-shuffle" class="iconbtn" aria-label="shuffle">⇄</button>
        <button id="np-prev" class="pbtn big" aria-label="previous">⏮</button>
        <button id="np-toggle" class="pbtn huge" aria-label="play or pause">▶</button>
        <button id="np-next" class="pbtn big" aria-label="next">⏭</button>
        <button id="np-repeat" class="iconbtn" aria-label="repeat">↻</button>
      </div>
      <div class="np-row">
        <button id="np-lyricsbtn" class="txtbtn">lyrics</button>
        <button id="np-queuebtn" class="txtbtn">queue</button>
      </div>
    </div>
    <div class="np-side">
      <div id="lyricspanel"></div>
      <div id="queuepanel" hidden></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</div>

<script src="/play/config.js"></script>
<script src="/play/js/core.js"></script>
<script src="/play/js/auth.js"></script>
<script src="/play/js/cache.js"></script>
<script src="/play/js/player.js"></script>
<script src="/play/js/lyrics.js"></script>
<script src="/play/js/upload.js"></script>
<script src="/play/js/views.js"></script>
<script src="/play/js/app.js"></script>
</body>
</html>
