<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lyrics qa — overlay visual</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="assets/lyrics/engine.css">
<style>html,body{margin:0;background:#000;}</style>
</head>
<body>
<div class="lyrics-overlay open" id="lyricsOverlay" aria-hidden="false">
  <div class="lyrics-bg" id="lyricsBg" style="background-image:url('https://picsum.photos/seed/qa-red/900')"></div>
  <button class="lyrics-close" aria-label="close lyrics">✕</button>
  <button class="lyrics-share" aria-label="share current lyric">share</button>
  <button class="lyrics-desk" aria-label="desk mode">desk</button>
  <div class="desk-stage" id="deskStage" aria-hidden="true"></div>
  <div class="lyrics-body">
    <div class="lyrics-side">
      <img id="lyricsArt" src="https://picsum.photos/seed/qa-red/300" alt="">
      <div class="lyrics-side-text">
        <p class="lyrics-title">QA Track</p>
        <p class="lyrics-artist">QA Artist</p>
      </div>
      <div class="lyrics-progress"><i style="width:40%"></i></div>
    </div>
    <div class="lyrics-mount" id="lyricsMount"></div>
  </div>
  <p class="lyrics-hint">qa</p>
</div>
<script src="assets/lyrics/engine.js"></script>
<script>
(function(){
  var raw = ["Now that the party is over","We are driving home together",
    "City lights are fading out","Hold my hand forever",
    "Do not let the morning come","Stay with me a little more",
    "The radio plays our song","We sing along together",
    "Windows down the night is young","This is our time forever"];
  function words(txt, t0){
    return txt.split(' ').map(function(w,i){return {text:w,start:t0+i*350,end:t0+(i+1)*350};});
  }
  var lines = raw.map(function(txt,i){
    var t0=i*5000, ws=words(txt,t0);
    return {start:t0,end:t0+4500,text:txt,words:ws};
  });
  var t0 = performance.now();
  var eng = window.LyricsEngine.create({container:document.getElementById('lyricsMount'),
    mode:'full',
    clock:{now:function(){return performance.now()-t0+12000;},playing:function(){return true;},
           onSeek:function(){},onRate:function(){}}});
  eng.setLyrics({source:'qa',level:'word',lines:lines});
  eng.open();
})();
</script>
</body>
</html>
